<script>
  (function () {
    var root = document.getElementById("iwms-root-20260731");

    if (!root || root.dataset.iwmsInit === "true") {
      return;
    }

    root.dataset.iwmsInit = "true";

    var mobileQuery = window.matchMedia("(max-width: 720px)");
    var boardElement = root.querySelector(".iwms-board");
    var mineCountElement = root.querySelector(".iwms-mine-count");
    var timeCountElement = root.querySelector(".iwms-time-count");
    var stateCountElement = root.querySelector(".iwms-state-count");
    var statusLineElement = root.querySelector(".iwms-status");
    var startButton = root.querySelector(".iwms-start");
    var retryButton = root.querySelector(".iwms-retry");
    var flagModeButton = root.querySelector(".iwms-flag-toggle");
    var imageElement = root.querySelector(".iwms-image");
    var sourceElement = root.querySelector(".iwms-source");

    var image560 = root.getAttribute("data-img-560");
    var image960 = root.getAttribute("data-img-960");
    var image1600 = root.getAttribute("data-img-1600");

    sourceElement.srcset = image560 + " 560w, " + image960 + " 960w, " + image1600 + " 1600w";
    imageElement.src = image1600;
    imageElement.srcset = sourceElement.srcset;
    imageElement.sizes = "100vw";

    function updateViewportHeight() {
      root.style.setProperty("--iwms-vh", (window.innerHeight * 0.01) + "px");
    }

    updateViewportHeight();
    window.addEventListener("resize", updateViewportHeight, { passive: true });
    window.addEventListener("orientationchange", updateViewportHeight, { passive: true });

    var config = getBoardConfig();
    var totalCells = config.columns * config.rows;

    var state = {
      cells: [],
      firstMove: true,
      gameOver: false,
      cleared: false,
      sessionArmed: false,
      revealed: 0,
      flagged: 0,
      seconds: 0,
      timerId: 0,
      flagMode: false
    };

    function getBoardConfig() {
      if (mobileQuery.matches) {
        return {
          key: "compact",
          columns: 20,
          rows: 18,
          mines: 62
        };
      }

      return {
        key: "wide",
        columns: 30,
        rows: 18,
        mines: 84
      };
    }

    function randomBelow(max) {
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        var values = new Uint32Array(1);
        var limit = Math.floor(0xffffffff / max) * max;
        var value = 0;

        do {
          window.crypto.getRandomValues(values);
          value = values[0];
        } while (value >= limit);

        return value % max;
      }

      return Math.floor(Math.random() * max);
    }

    function getNeighbors(index) {
      var neighbors = [];
      var row = Math.floor(index / config.columns);
      var column = index % config.columns;

      for (var rowOffset = -1; rowOffset <= 1; rowOffset += 1) {
        for (var columnOffset = -1; columnOffset <= 1; columnOffset += 1) {
          if (rowOffset === 0 && columnOffset === 0) {
            continue;
          }

          var nextRow = row + rowOffset;
          var nextColumn = column + columnOffset;

          if (nextRow < 0 || nextRow >= config.rows || nextColumn < 0 || nextColumn >= config.columns) {
            continue;
          }

          neighbors.push(nextRow * config.columns + nextColumn);
        }
      }

      return neighbors;
    }

    function formatTime(seconds) {
      return String(Math.min(seconds, 999)).padStart(3, "0");
    }

    function stopTimer() {
      if (state.timerId) {
        window.clearInterval(state.timerId);
        state.timerId = 0;
      }
    }

    function startTimer() {
      stopTimer();
      state.timerId = window.setInterval(function () {
        state.seconds += 1;
        timeCountElement.textContent = formatTime(state.seconds);
      }, 1000);
    }

    function describeCell(cell) {
      if (cell.flagged) {
        return "Flagged tile";
      }

      if (!cell.revealed) {
        return "Hidden tile";
      }

      if (cell.mine) {
        return "Mine";
      }

      if (cell.adjacent > 0) {
        return "Adjacent mines " + cell.adjacent;
      }

      return "Empty tile";
    }

    function setStatus(message) {
      statusLineElement.textContent = message;
    }

    function updateHud() {
      mineCountElement.textContent = String(config.mines - state.flagged);
      timeCountElement.textContent = formatTime(state.seconds);

      if (!state.sessionArmed) {
        stateCountElement.textContent = "START";
      } else if (state.cleared) {
        stateCountElement.textContent = "CLEAR";
      } else if (state.gameOver) {
        stateCountElement.textContent = "BOOM";
      } else if (state.firstMove) {
        stateCountElement.textContent = "READY";
      } else {
        stateCountElement.textContent = "PLAY";
      }
    }

    function syncBoardAvailability() {
      var locked = !state.sessionArmed || state.gameOver || state.cleared;

      boardElement.setAttribute("aria-disabled", String(locked));

      for (var index = 0; index < state.cells.length; index += 1) {
        state.cells[index].element.disabled = locked;
      }
    }

    function syncActionButtons() {
      var sessionComplete = state.gameOver || state.cleared;

      startButton.disabled = state.sessionArmed && !sessionComplete;
      retryButton.disabled = !state.sessionArmed && state.seconds === 0 && state.revealed === 0;
      flagModeButton.disabled = !state.sessionArmed || sessionComplete;
    }

    function renderCell(cell) {
      var element = cell.element;

      if (cell.mine && cell.revealed) {
        element.dataset.state = "mine";
        element.dataset.exploded = cell.exploded ? "true" : "false";
        element.removeAttribute("data-count");
      } else if (cell.wrongFlag) {
        element.dataset.state = "wrong";
        element.removeAttribute("data-count");
        element.removeAttribute("data-exploded");
      } else if (cell.flagged) {
        element.dataset.state = "flagged";
        element.removeAttribute("data-count");
        element.removeAttribute("data-exploded");
      } else if (cell.revealed) {
        element.dataset.state = "revealed";

        if (cell.adjacent > 0) {
          element.dataset.count = String(cell.adjacent);
        } else {
          element.removeAttribute("data-count");
        }

        element.removeAttribute("data-exploded");
      } else {
        element.dataset.state = "hidden";
        element.removeAttribute("data-count");
        element.removeAttribute("data-exploded");
      }

      element.setAttribute("aria-label", describeCell(cell));
    }

    function expandFrom(startIndex) {
      var queue = [startIndex];
      var seen = new Set(queue);

      while (queue.length > 0) {
        var index = queue.pop();
        var cell = state.cells[index];

        if (!cell || cell.flagged || cell.mine) {
          continue;
        }

        if (!cell.revealed) {
          cell.revealed = true;
          state.revealed += 1;
          renderCell(cell);
        }

        if (cell.adjacent !== 0) {
          continue;
        }

        var neighbors = getNeighbors(index);

        for (var i = 0; i < neighbors.length; i += 1) {
          var nextIndex = neighbors[i];
          var nextCell = state.cells[nextIndex];

          if (!nextCell.flagged && !nextCell.mine && !seen.has(nextIndex)) {
            seen.add(nextIndex);
            queue.push(nextIndex);
          }
        }
      }
    }

    function finishAsLost(explodedIndex) {
      state.gameOver = true;
      stopTimer();

      for (var index = 0; index < state.cells.length; index += 1) {
        var cell = state.cells[index];

        if (cell.mine) {
          cell.revealed = true;
          cell.exploded = index === explodedIndex;
        } else if (cell.flagged) {
          cell.wrongFlag = true;
        }

        renderCell(cell);
      }

      setStatus("BOOM. HIT RETRY TO PLAY AGAIN.");
      updateHud();
      syncBoardAvailability();
      syncActionButtons();
    }

    function finishAsWon() {
      state.cleared = true;
      stopTimer();

      for (var index = 0; index < state.cells.length; index += 1) {
        var cell = state.cells[index];

        if (cell.mine && !cell.flagged) {
          cell.flagged = true;
          state.flagged += 1;
        }

        renderCell(cell);
      }

      setStatus("CLEAR. HIT RETRY OR START AGAIN.");
      updateHud();
      syncBoardAvailability();
      syncActionButtons();
    }

    function checkForClear() {
      if (state.revealed === totalCells - config.mines) {
        finishAsWon();
      }
    }

    function plantMines(safeIndex) {
      var blocked = new Set([safeIndex].concat(getNeighbors(safeIndex)));
      var candidates = [];

      for (var index = 0; index < totalCells; index += 1) {
        if (!blocked.has(index)) {
          candidates.push(index);
        }
      }

      for (var swapFrom = candidates.length - 1; swapFrom > 0; swapFrom -= 1) {
        var swapTo = randomBelow(swapFrom + 1);
        var temporary = candidates[swapFrom];
        candidates[swapFrom] = candidates[swapTo];
        candidates[swapTo] = temporary;
      }

      for (var mineIndex = 0; mineIndex < config.mines; mineIndex += 1) {
        state.cells[candidates[mineIndex]].mine = true;
      }

      for (var cellIndex = 0; cellIndex < state.cells.length; cellIndex += 1) {
        if (state.cells[cellIndex].mine) {
          continue;
        }

        var count = 0;
        var neighbors = getNeighbors(cellIndex);

        for (var neighborIndex = 0; neighborIndex < neighbors.length; neighborIndex += 1) {
          if (state.cells[neighbors[neighborIndex]].mine) {
            count += 1;
          }
        }

        state.cells[cellIndex].adjacent = count;
      }
    }

    function revealCell(index) {
      var cell = state.cells[index];

      if (!state.sessionArmed || !cell || cell.flagged || cell.revealed || state.gameOver || state.cleared) {
        return;
      }

      if (state.firstMove) {
        plantMines(index);
        state.firstMove = false;
        startTimer();
        setStatus("PLAYING. OPEN CELLS AND AVOID MINES.");
      }

      if (cell.mine) {
        finishAsLost(index);
        return;
      }

      expandFrom(index);
      checkForClear();
      updateHud();
    }

    function toggleFlag(index) {
      var cell = state.cells[index];

      if (!state.sessionArmed || !cell || cell.revealed || state.gameOver || state.cleared) {
        return;
      }

      cell.flagged = !cell.flagged;
      state.flagged += cell.flagged ? 1 : -1;
      renderCell(cell);
      updateHud();
    }

    function handleCellAction(index, forceFlagMode) {
      if (forceFlagMode || state.flagMode) {
        toggleFlag(index);
        return;
      }

      revealCell(index);
    }

    function setFlagMode(active, silent) {
      state.flagMode = active;
      flagModeButton.setAttribute("aria-pressed", String(active));
      flagModeButton.textContent = active ? "FLAG ON" : "FLAG OFF";

      if (!silent) {
        setStatus(active ? "FLAG MODE ON." : "FLAG MODE OFF.");
      }
    }

    function buildBoard() {
      boardElement.style.setProperty("--iwms-columns", String(config.columns));
      boardElement.style.setProperty("--iwms-rows", String(config.rows));
      boardElement.replaceChildren();
      state.cells = [];

      var fragment = document.createDocumentFragment();

      for (var index = 0; index < totalCells; index += 1) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "iwms-cell";
        button.dataset.index = String(index);
        button.setAttribute("aria-label", "Hidden tile");

        var cell = {
          index: index,
          mine: false,
          revealed: false,
          flagged: false,
          wrongFlag: false,
          exploded: false,
          adjacent: 0,
          element: button
        };

        state.cells.push(cell);
        fragment.appendChild(button);
      }

      boardElement.appendChild(fragment);

      for (var renderIndex = 0; renderIndex < state.cells.length; renderIndex += 1) {
        renderCell(state.cells[renderIndex]);
      }

      syncBoardAvailability();
    }

    function resetBoard(armImmediately) {
      config = getBoardConfig();
      totalCells = config.columns * config.rows;
      stopTimer();
      state.firstMove = true;
      state.gameOver = false;
      state.cleared = false;
      state.sessionArmed = Boolean(armImmediately);
      state.revealed = 0;
      state.flagged = 0;
      state.seconds = 0;
      state.flagMode = false;
      buildBoard();
      setFlagMode(false, true);
      setStatus(state.sessionArmed ? "OPEN A TILE. RIGHT CLICK TO FLAG." : "PRESS START TO BEGIN.");
      updateHud();
      syncActionButtons();
    }

    function startGame() {
      if (state.sessionArmed && !state.gameOver && !state.cleared) {
        return;
      }

      if (state.gameOver || state.cleared) {
        resetBoard(true);
        return;
      }

      state.sessionArmed = true;
      setStatus("OPEN A TILE. RIGHT CLICK TO FLAG.");
      updateHud();
      syncBoardAvailability();
      syncActionButtons();
    }

    function retryGame() {
      resetBoard(true);
    }

    boardElement.addEventListener("click", function (event) {
      var button = event.target.closest(".iwms-cell");

      if (!button) {
        return;
      }

      handleCellAction(Number(button.dataset.index), false);
    });

    boardElement.addEventListener("contextmenu", function (event) {
      var button = event.target.closest(".iwms-cell");

      if (!button) {
        return;
      }

      event.preventDefault();
      handleCellAction(Number(button.dataset.index), true);
    });

    boardElement.addEventListener("keydown", function (event) {
      var button = event.target.closest(".iwms-cell");

      if (!button) {
        return;
      }

      var index = Number(button.dataset.index);

      if (event.key === "f" || event.key === "F") {
        event.preventDefault();
        toggleFlag(index);
      }

      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        handleCellAction(index, false);
      }
    });

    startButton.addEventListener("click", startGame);
    retryButton.addEventListener("click", retryGame);
    flagModeButton.addEventListener("click", function () {
      setFlagMode(!state.flagMode);
    });

    if (typeof mobileQuery.addEventListener === "function") {
      mobileQuery.addEventListener("change", function () {
        var nextConfig = getBoardConfig();

        if (nextConfig.key !== config.key) {
          resetBoard(state.sessionArmed && !state.gameOver && !state.cleared);
        }
      });
    }

    resetBoard(false);
  })();
</script>
